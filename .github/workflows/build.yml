name: Build & Release

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -n 's/.*val baseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          LATEST_PATCH=$(
            git tag -l "v${BASE_VERSION}.*" |
              sed -n "s/^v${BASE_VERSION}\.\([0-9][0-9]*\)$/\1/p" |
              sort -n |
              tail -1
          )
          NEXT_PATCH=$(( ${LATEST_PATCH:--1} + 1 ))

          if [[ "$GITHUB_REF_NAME" == "beta" ]]; then
            LATEST_BETA=$(
              git tag -l "v${BASE_VERSION}.${NEXT_PATCH}-beta.*" |
                sed -n "s/^v${BASE_VERSION}\.${NEXT_PATCH}-beta\.\([0-9][0-9]*\)$/\1/p" |
                sort -n |
                tail -1
            )
            NEXT_BETA=$(( ${LATEST_BETA:-0} + 1 ))
            TAG="v${BASE_VERSION}.${NEXT_PATCH}-beta.${NEXT_BETA}"
            IS_BETA=true
            CHANNEL=beta
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TAG="v${BASE_VERSION}.${NEXT_PATCH}"
            IS_BETA=false
            CHANNEL=stable
          else
            echo "::error::Releases are only supported from main or beta"
            exit 1
          fi

          # Seconds since 2024-01-01 remain below Android's versionCode limit
          # for decades and ensure later beta/stable builds are upgrades.
          VERSION_CODE=$(( $(date -u +%s) - 1704067200 ))
          VERSION_NAME="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true

      - name: Run lint
        shell: bash
        run: ./gradlew lint --parallel --build-cache --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 14

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --parallel --build-cache --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  build:
    name: Build Signed APKs
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true

      - name: Decode signing keystore
        shell: bash
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build release APKs
        shell: bash
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --parallel --build-cache --no-daemon --stacktrace \
            -PversionCode=${{ needs.version.outputs.version_code }} \
            -PversionName=${{ needs.version.outputs.version_name }} \
            -PciBuild

      - name: Prepare and verify release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          IS_BETA: ${{ needs.version.outputs.is_beta }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ABIS=(arm64-v8a armeabi-v7a x86 x86_64 universal)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPOSITORY_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          RELEASE_URL="$REPOSITORY_URL/releases/tag/$RELEASE_TAG"
          CHANGELOG_URL="$REPOSITORY_URL/blob/$RELEASE_TAG/CHANGELOG.md"
          SIGNING_CERTIFICATE_SHA256=""

          if [[ "$IS_BETA" == "true" ]]; then
            CHANGELOG_SECTION="Unreleased"
          else
            CHANGELOG_SECTION="$VERSION_NAME"
          fi
          CHANGELOG_HEADING="## [$CHANGELOG_SECTION]"
          awk -v heading="$CHANGELOG_HEADING" '
            index($0, heading) == 1 &&
              (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") {
                found = 1
                next
              }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-assets/release-notes.md || {
            echo "::error::CHANGELOG.md has no section for $CHANGELOG_SECTION"
            exit 1
          }
          if ! grep -q '[^[:space:]]' release-assets/release-notes.md; then
            echo "::error::The $CHANGELOG_SECTION changelog section is empty"
            exit 1
          fi
          RELEASE_NOTES=$(cat release-assets/release-notes.md)

          for ABI in "${ABIS[@]}"; do
            SOURCE="app/build/outputs/apk/release/app-${ABI}-release.apk"
            TARGET="release-assets/akihz-${RELEASE_TAG}-${ABI}.apk"
            test -s "$SOURCE" || { echo "::error::Missing APK for $ABI"; exit 1; }
            VERIFY_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$SOURCE")
            printf '%s\n' "$VERIFY_OUTPUT"
            APK_CERTIFICATE_SHA256=""
            while IFS= read -r LINE; do
              if [[ "$LINE" == *Signer*"certificate SHA-256 digest: "* ]]; then
                APK_CERTIFICATE_SHA256=${LINE##*: }
                break
              fi
            done <<< "$VERIFY_OUTPUT"
            [[ "$APK_CERTIFICATE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "::error::Could not read the signing certificate SHA-256 for $ABI"
              exit 1
            }
            if [[ -z "$SIGNING_CERTIFICATE_SHA256" ]]; then
              SIGNING_CERTIFICATE_SHA256="${APK_CERTIFICATE_SHA256,,}"
            elif [[ "$SIGNING_CERTIFICATE_SHA256" != "${APK_CERTIFICATE_SHA256,,}" ]]; then
              echo "::error::Release APKs do not share the same signing certificate"
              exit 1
            fi
            mv "$SOURCE" "$TARGET"
          done

          (
            cd release-assets
            sha256sum ./*.apk > checksums-sha256.txt
          )

          ASSETS_JSON=$(
            for ABI in "${ABIS[@]}"; do
              FILE="akihz-${RELEASE_TAG}-${ABI}.apk"
              SHA=$(sha256sum "release-assets/$FILE" | cut -d' ' -f1)
              SIZE=$(stat -c%s "release-assets/$FILE")
              URL="$REPOSITORY_URL/releases/download/$RELEASE_TAG/$FILE"
              jq -n \
                --arg abi "$ABI" \
                --arg file "$FILE" \
                --arg url "$URL" \
                --arg sha256 "$SHA" \
                --argjson size "$SIZE" \
                '{abi: $abi, file: $file, url: $url, sha256: $sha256, size: $size}'
            done | jq -s .
          )

          jq -n \
            --arg schema_version "1" \
            --arg package_name "akihz.anlaki.dev" \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg channel "$RELEASE_CHANNEL" \
            --argjson prerelease "$IS_BETA" \
            --arg commit "$GITHUB_SHA" \
            --arg release_date "$RELEASE_DATE" \
            --arg repository "$REPOSITORY_URL" \
            --arg release_url "$RELEASE_URL" \
            --arg changelog "$CHANGELOG_URL" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg signing_certificate_sha256 "$SIGNING_CERTIFICATE_SHA256" \
            --arg min_sdk "30" \
            --arg target_sdk "36" \
            --argjson assets "$ASSETS_JSON" \
            '{
              schemaVersion: ($schema_version | tonumber),
              packageName: $package_name,
              versionName: $version_name,
              versionCode: $version_code,
              channel: $channel,
              prerelease: $prerelease,
              commit: $commit,
              releaseDate: $release_date,
              repository: $repository,
              releaseUrl: $release_url,
              changelog: $changelog,
              releaseNotes: $release_notes,
              minSdk: ($min_sdk | tonumber),
              targetSdk: ($target_sdk | tonumber),
              requirements: {
                shizuku: {
                  required: true,
                  url: "https://shizuku.rikka.app/"
                }
              },
              signingCertificate: {
                sha256: $signing_certificate_sha256
              },
              assets: $assets
            }' > release-assets/release-metadata.json

          {
            echo
            echo "[Full changelog]($CHANGELOG_URL)"
          } >> release-assets/release-notes.md

          {
            echo "## Release assets"
            echo
            echo "- Channel: $RELEASE_CHANNEL"
            echo "- Version: $VERSION_NAME ($VERSION_CODE)"
            echo "- APKs: ${#ABIS[@]} signed variants"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keystore
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload release assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-assets-${{ needs.version.outputs.tag }}
          path: release-assets/
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.version.outputs.tag }}
          path: artifacts/

      - name: Create and push tag
        shell: bash
        run: |
          git tag "${{ needs.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            artifacts/*.apk
            artifacts/checksums-sha256.txt
            artifacts/release-metadata.json
          name: akihz ${{ needs.version.outputs.tag }}
          body_path: artifacts/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ needs.version.outputs.is_beta == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notify on Failure
    needs: [version, lint, test, build, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI failure on ${GITHUB_REF_NAME} ($(date +%Y-%m-%d))" \
            --body "Pipeline failed for commit [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          **Branch:** \`${GITHUB_REF_NAME}\`" \
            --label bug
